<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Jackpot</title>
<link rel="stylesheet" href="common.css">
<style>
  .coins{position:absolute;inset:0;z-index:-1;overflow:hidden}
  .coin{position:absolute;top:-140px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#c9a24a 45%,#9c6d1c 100%);
    box-shadow:inset 0 0 0 6px rgba(156,109,28,.8),inset 0 0 0 10px rgba(255,241,184,.5);animation:fall linear infinite both}
  .coin::after{content:"€";position:absolute;inset:0;display:grid;place-items:center;font:600 calc(var(--s) * .55)/1 var(--gp-serif);color:#94702a}
  @keyframes fall{from{transform:translateY(0) rotateY(0deg)}to{transform:translateY(1300px) rotateY(720deg)}}

  .panel{position:absolute;left:50%;top:190px;width:1500px;margin-left:-750px;height:560px;border-radius:40px;
    background:linear-gradient(180deg,rgba(74,15,28,.95),rgba(30,8,16,.95));border:5px solid #c9a24a;
    box-shadow:0 0 0 14px rgba(18,6,10,.7),0 0 120px rgba(201,162,74,.35)}
  .bulbs{position:absolute;inset:-34px;pointer-events:none}
  .bulbs i{position:absolute;width:22px;height:22px;margin:-11px;border-radius:50%;background:#fff3c4;box-shadow:0 0 18px 6px rgba(255,214,110,.9);animation:bulb .5s steps(1) infinite both}
  .bulbs i:nth-child(2n){animation-delay:-.25s}
  @keyframes bulb{0%{opacity:1}50%{opacity:.18}}

  .digits{position:absolute;left:0;right:0;top:80px;display:flex;justify-content:center;gap:16px}
  .win{width:170px;height:220px;border-radius:16px;overflow:hidden;position:relative;background:#07050b;border:3px solid rgba(201,162,74,.6);
    box-shadow:inset 0 18px 24px rgba(0,0,0,.8),inset 0 -18px 24px rgba(0,0,0,.8)}
  .win .strip{position:absolute;left:0;right:0;top:0}
  .win .strip div{height:220px;display:grid;place-items:center;font:600 170px/1 var(--gp-serif);color:#fff3c4}
  .win .strip div:last-child{background:var(--gp-gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{position:absolute;left:0;right:0;top:360px;text-align:center;font:800 70px/1.1 var(--gp-sans);letter-spacing:.02em}
  .sub2{position:absolute;left:0;right:0;top:460px;text-align:center}
  .tagline{position:absolute;left:50%;top:810px;transform:translateX(-50%);padding:22px 70px;background:linear-gradient(180deg,#c8173a,#7d0a1f);
    box-shadow:0 0 0 3px #c9a24a;font:500 60px/1 var(--gp-serif);font-style:italic;color:#fff8e6;white-space:nowrap}
  .end .k{margin-top:50px}
</style></head>
<body data-duration="13">
<div class="stage">
  <img class="photo" src="../../site/foto/sala-vlt.jpg" alt="" onerror="this.remove()">
  <div class="vignette"></div>
  <div class="rays"></div>
  <div class="coins" data-in="inFade 0" data-out="8.6"></div>

  <div data-in="inZoom .1" data-out="8.6" style="position:absolute;inset:0">
    <div class="panel">
      <div class="bulbs"></div>
      <div class="digits"></div>
      <div class="sub" data-in="inUp 3.4">Jackpot progressivi sulle VLT</div>
      <div class="kicker sub2" data-in="inFade 4.2"><span class="line"></span>Ogni giorno in sala<span class="line"></span></div>
    </div>
    <div style="position:absolute;inset:0" data-in="inFade 5"><div class="tagline">Ti aspettiamo da Games Palace</div></div>
  </div>

  <div class="center end">
    <div class="biglogo" data-logo data-in="inZoom 9.0"></div>
    <div class="kicker k" data-in="inFade 10.1">Via del Tiglio 149/F · Calcinaia</div>
  </div>
</div>
<script src="common.js"></script>
<script>
  // Rulli di cifre che si fermano sulla parola JACKPOT
  var word = "JACKPOT", H = 220, N = 18, box = document.querySelector(".digits");
  word.split("").forEach(function (ch, k) {
    var html = "";
    for (var i = 0; i < N - 1; i++) html += "<div>" + ((i * 7 + k * 3) % 10) + "</div>";
    box.insertAdjacentHTML("beforeend", '<div class="win"><div class="strip">' + html + "<div>" + ch + "</div></div></div>");
    box.lastChild.firstChild.animate([{ transform: "translateY(0)" }, { transform: "translateY(" + -(N - 1) * H + "px)" }],
      { duration: 1500 + k * 220, delay: 700, easing: "cubic-bezier(.25,.1,.2,1.03)", fill: "both" });
  });

  // Lampadine lungo il bordo del pannello
  var bulbs = document.querySelector(".bulbs"), W = 1568, Hh = 628, step = 56;
  for (var x = 0; x <= W; x += step) { add(x, 0); add(x, Hh); }
  for (var y = step; y < Hh; y += step) { add(0, y); add(W, y); }
  function add(x, y) { var i = document.createElement("i"); i.style.left = x + "px"; i.style.top = y + "px"; bulbs.appendChild(i); }

  // Pioggia di monete (deterministica)
  var coins = document.querySelector(".coins");
  for (var c = 0; c < 34; c++) {
    var el = document.createElement("div"), s = 50 + rnd() * 70;
    el.className = "coin";
    el.style.cssText = "left:" + rnd() * 100 + "%;width:" + s + "px;height:" + s + "px;--s:" + s + "px;animation-duration:" +
      (2.6 + rnd() * 2.4) + "s;animation-delay:" + (-rnd() * 5) + "s;opacity:" + (0.55 + rnd() * 0.45);
    coins.appendChild(el);
  }
</script>
</body></html>
