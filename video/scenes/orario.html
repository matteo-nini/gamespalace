<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Orari</title>
<link rel="stylesheet" href="common.css">
<style>
  .title{margin-top:30px;width:1600px;font-size:96px}
  .row{margin-top:44px;display:flex;align-items:center;gap:60px}
  .hour small{display:block;font:800 26px/1 var(--gp-sans);letter-spacing:.4em;text-transform:uppercase;color:var(--gp-gold-light);margin-bottom:14px}
  .hour b{display:block;font:800 170px/1 var(--gp-sans);color:#fff;letter-spacing:.01em;text-shadow:0 8px 40px rgba(0,0,0,.6)}
  .bridge{display:flex;align-items:center;gap:18px;margin-top:40px}
  .bridge i{display:block;width:150px;height:2px;background:linear-gradient(90deg,transparent,#c9a24a)}
  .bridge i:last-child{background:linear-gradient(90deg,#c9a24a,transparent)}
  .bridge img{width:120px}
  .sub{margin-top:40px;width:1500px}
</style></head>
<body data-duration="10">
<div class="stage">
  <img class="photo" src="../../site/foto/sala-vlt.jpg" alt="">
  <div class="vignette"></div>
  <div class="rays"></div>
  <div class="sparkles"></div>
  <div class="content"><div class="center">
    <span class="t-tag" data-in="inZoom .4">Orari di apertura</span>
    <div class="t-title title" data-fit="110" data-in="inUp .8"><span class="shine">Aperti tutti i giorni</span></div>
    <div class="row">
      <div class="hour" data-in="inLeft 1.4"><small>Apertura</small><b>10:00</b></div>
      <div class="bridge" data-in="inFade 1.9"><i></i><img src="../../site/assets/logo-stars.svg" alt=""><i></i></div>
      <div class="hour" data-in="inRight 2.2"><small>Chiusura</small><b>03:00</b></div>
    </div>
    <div class="t-sub sub" data-fit="70" data-in="inUp 2.8">Dal mattino fino a notte fonda, 7 giorni su 7</div>
  </div></div>
</div>
<script src="contenuti.js"></script>
<script src="common.js"></script>
</body></html>
