<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Promo</title>
<link rel="stylesheet" href="common.css">
<style>
  /* Scena promo personalizzabile: testi e foto da videos.json (etichetta, titolo, sotto, nota, foto) */
  .tag{display:inline-block;padding:16px 40px;background:var(--gp-red);box-shadow:0 0 0 3px #c9a24a;font:800 32px/1 var(--gp-sans);letter-spacing:.34em;text-transform:uppercase}
  .title{margin-top:56px;max-width:1600px;font-size:130px;line-height:1.08}
  .sub{margin-top:46px;font:500 58px/1.3 var(--gp-serif);font-style:italic;color:var(--gp-ivory);max-width:1400px}
  .nota{margin-top:56px;display:inline-block;padding:22px 60px;background:var(--gp-gold-grad);color:#2a1a05;font:800 32px/1 var(--gp-sans);letter-spacing:.3em;text-transform:uppercase}
  .frame{position:absolute;inset:150px 90px 110px;border:2px solid rgba(201,162,74,.6);z-index:-1}
  .frame::before{content:"";position:absolute;inset:14px;border:1px solid rgba(201,162,74,.3)}
  .corner{position:absolute;left:50%;top:0;width:200px;margin:-14px 0 0 -100px;padding:0 20px;background:#2a0a12}
</style></head>
<body data-duration="11">
<div class="stage">
  <img class="photo" src="../../site/foto/bar.jpg" alt="">
  <div class="vignette"></div>
  <div class="rays"></div>
  <div class="sparkles"></div>
  <div class="frame" data-in="inFade .2" data-out="7.4">
    <img class="corner" src="../../site/assets/logo-stars.svg" alt="">
  </div>

  <div class="center">
    <div data-in="inZoom .4" data-out="7.4"><span class="tag" data-param="etichetta">Promo</span></div>
    <div class="display title" data-in="inUp .9" data-out="7.4"><span class="shine" data-param="titolo">Titolo promo</span></div>
    <div class="sub" data-in="inUp 1.7" data-out="7.4" data-param="sotto">Descrizione</div>
    <div data-in="inZoom 2.6" data-out="7.4"><span class="nota" data-param="nota">Chiedi allo staff</span></div>
  </div>

  <div class="center">
    <div class="biglogo" data-logo data-in="inZoom 7.9"></div>
    <div class="kicker" style="margin-top:50px" data-in="inFade 8.7">Nuova gestione · Calcinaia</div>
  </div>
</div>
<script src="common.js"></script>
</body></html>
