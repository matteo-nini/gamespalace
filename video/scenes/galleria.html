<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>La sala</title>
<link rel="stylesheet" href="common.css">
<style>
  /* Foto a tutto schermo con dissolvenza incrociata; didascalia nell'area contenuti */
  .slide{position:absolute;inset:0;opacity:0;z-index:-1}
  .slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,6,10,.85) 0%,rgba(18,6,10,.3) 55%,rgba(18,6,10,.1) 100%),
    linear-gradient(180deg,rgba(18,6,10,.7) 0%,transparent 25%,transparent 60%,rgba(18,6,10,.8) 100%)}
  .cap{position:absolute;left:0;bottom:40px;width:1100px;opacity:0}
  .cap small{display:block;font:800 26px/1 var(--gp-sans);letter-spacing:.4em;text-transform:uppercase;color:var(--gp-gold-light);margin-bottom:20px}
  .cap b{display:block;font:500 120px/1 var(--gp-serif);color:#fff8e6}
  .cap span{display:block;margin-top:20px;font:500 48px/1.2 var(--gp-serif);font-style:italic;color:#efe6d6}
</style></head>
<body data-duration="13" data-manual>
<div class="stage">
  <div class="slides"></div>
  <div class="content"></div>
</div>
<script src="contenuti.js"></script>
<script src="common.js"></script>
<script>
  var SLIDES = [
    ["accoglienza.jpg", "Benvenuti", "Accoglienza", "Un ambiente elegante, tutti i giorni"],
    ["sala-vlt.jpg", "Videolottery", "Sala VLT", "Tanti giochi e jackpot progressivi"],
    ["slot.jpg", "Slot", "Area slot", "I titoli più amati"],
    ["bar.jpg", "Bar", "Il nostro bar", "Caffetteria, bibite e aperitivi"],
    ["sala-relax.jpg", "Comfort", "Spazi eleganti", "Una pausa in tutta tranquillità"]
  ];
  var box = document.querySelector(".slides"), C = document.querySelector(".content"), D = 2900, STEP = 2500;
  SLIDES.forEach(function (s, k) {
    box.insertAdjacentHTML("beforeend", '<div class="slide"><img src="../../site/foto/' + s[0] + '" alt=""></div>');
    C.insertAdjacentHTML("beforeend", '<div class="cap"><small>' + s[1] + "</small><b>" + s[2] + "</b><span>" + s[3] + "</span></div>");
    var el = box.lastChild, cap = C.lastChild, t0 = 300 + k * STEP;
    el.animate([{ opacity: 0 }, { opacity: 1, offset: 0.14 }, { opacity: 1, offset: 0.86 }, { opacity: 0 }], { duration: D, delay: t0, fill: "both" });
    el.querySelector("img").animate([{ transform: "scale(1.04)" }, { transform: "scale(1.15) translateX(" + (k % 2 ? 2 : -2) + "%)" }], { duration: D, delay: t0, fill: "both" });
    cap.animate([{ opacity: 0, transform: "translateX(-60px)" }, { opacity: 1, transform: "none", offset: 0.25 }, { opacity: 1, transform: "none", offset: 0.8 }, { opacity: 0 }], { duration: D - 200, delay: t0 + 100, fill: "both" });
  });
  GP.ready();
</script>
</body></html>
