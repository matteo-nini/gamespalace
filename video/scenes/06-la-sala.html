<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>La sala</title>
<link rel="stylesheet" href="common.css">
<style>
  /* Galleria fotografica: ogni foto 3 s con dissolvenza incrociata e zoom lento */
  .slide{position:absolute;inset:0;opacity:0}
  .slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,6,10,.82) 0%,rgba(18,6,10,.25) 55%,rgba(18,6,10,.1) 100%),linear-gradient(0deg,rgba(18,6,10,.75),transparent 40%)}
  .cap{position:absolute;left:110px;bottom:170px;z-index:2}
  .cap small{display:block;font:800 26px/1 var(--gp-sans);letter-spacing:.4em;text-transform:uppercase;color:var(--gp-gold-light);margin-bottom:24px}
  .cap b{display:block;font:500 130px/1 var(--gp-serif);color:#fff8e6}
  .cap i{display:block;width:140px;height:3px;background:var(--gp-red);margin-top:34px}
  .end{background:radial-gradient(ellipse 75% 70% at 50% 45%,#5a1220 0%,#2a0a12 50%,#12060a 85%)}
</style></head>
<body data-duration="18">
<div class="stage">
  <div class="slides"></div>
  <div class="center end" data-in="inFade 15.2">
    <div class="rays"></div>
    <div class="biglogo" data-logo data-in="inZoom 15.5"></div>
    <div class="kicker" style="margin-top:50px" data-in="inFade 16.2">Nuova gestione · Calcinaia</div>
    <div class="kicker" style="margin-top:22px;color:var(--gp-ivory)" data-in="inFade 16.5">Tutti i giorni dalle 10 alle 3</div>
  </div>
</div>
<script>
  var SLIDES = [
    ["sala-vlt.jpg", "Videolottery", "La sala VLT"],
    ["slot.jpg", "Slot", "Le tue preferite"],
    ["bar.jpg", "Bar", "Il caffè è servito"],
    ["lounge.jpg", "Relax", "La lounge"],
    ["prive.jpg", "Benvenuti", "Il privé"]
  ];
  var box = document.querySelector(".slides"), D = 3200;
  SLIDES.forEach(function (s, k) {
    box.insertAdjacentHTML("beforeend", '<div class="slide"><img src="../../site/foto/' + s[0] + '" alt=""><div class="cap"><small>' + s[1] + "</small><b>" + s[2] + "</b><i></i></div></div>");
    var el = box.lastChild, t0 = k * 3000;
    el.animate([{ opacity: 0 }, { opacity: 1, offset: 0.12 }, { opacity: 1, offset: 0.88 }, { opacity: 0 }], { duration: D, delay: t0, fill: "both" });
    el.querySelector("img").animate([{ transform: "scale(1.04) translateX(0)" }, { transform: "scale(1.16) translateX(" + (k % 2 ? 2 : -2) + "%)" }], { duration: D, delay: t0, fill: "both" });
    el.querySelector(".cap").animate([{ opacity: 0, transform: "translateX(-80px)" }, { opacity: 1, transform: "none" }], { duration: 800, delay: t0 + 300, easing: "cubic-bezier(.2,.8,.2,1)", fill: "both" });
  });
</script>
<script src="common.js"></script>
</body></html>
