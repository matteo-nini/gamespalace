<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Nuova gestione</title>
<link rel="stylesheet" href="common.css">
<style>
  .kick{margin-top:56px}
  .sub{margin-top:70px;font:500 60px/1.3 var(--gp-serif);font-style:italic;color:var(--gp-ivory)}
  .sub em{color:var(--gp-gold-light)}
  .wait{font-size:140px}
  .addr{margin-top:46px;font:600 46px/1.4 var(--gp-sans);color:var(--gp-ivory)}
  .addr small{display:block;font-size:34px;color:#d8cbbd;font-weight:400;margin-top:8px}
  .open{margin-top:44px;display:inline-block;padding:22px 60px;background:var(--gp-red);box-shadow:0 0 0 3px #c9a24a;color:#fff;font:800 32px/1 var(--gp-sans);letter-spacing:.3em;text-transform:uppercase}
</style></head>
<body data-duration="12">
<div class="stage">
  <img class="photo" src="../../site/foto/sala-relax.jpg" alt="">
  <div class="vignette"></div>
  <div class="rays"></div>
  <div class="sparkles"></div>

  <div class="center">
    <div class="biglogo" data-logo data-in="inZoom .2" data-out="3.6"></div>
    <div class="kicker kick" data-in="inFade 1.4" data-out="3.6"><span class="line"></span>Sala VLT &amp; Slot · Calcinaia<span class="line"></span></div>
  </div>

  <div class="center">
    <div class="ribbon" data-in="inStamp 4.1" data-out="7.6"><span>Nuova gestione</span></div>
    <div class="sub" data-in="inUp 4.9" data-out="7.6">Nuovo staff, <em>nuova energia</em>, la stessa eleganza</div>
  </div>

  <div class="center">
    <div class="display wait" data-in="inUp 8.0"><span class="shine">Ti aspettiamo</span></div>
    <div class="addr" data-in="inUp 8.6">Via del Tiglio 149/F · Calcinaia<small>Centro Torretta White</small></div>
    <div class="open" data-in="inZoom 9.3">Aperti tutti i giorni</div>
  </div>
</div>
<script src="common.js"></script>
</body></html>
